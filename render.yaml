databases:
  - name: expense-tracker-db-chaitanya1301
    databaseName: expense_tracker
    plan: free

services:
  - type: web
    name: expense-tracker-api-chaitanya1301
    runtime: node
    plan: free
    rootDir: src/backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db-chaitanya1301
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Must exactly match the frontend's deployed origin below (scheme + host,
      # no trailing slash). Verify after first deploy in case Render assigned
      # a different hostname due to a name collision.
      - key: FRONTEND_ORIGIN
        value: https://expense-tracker-app-chaitanya1301.onrender.com

  - type: web
    name: expense-tracker-app-chaitanya1301
    runtime: static
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Must exactly match the backend service's deployed URL above. Verify
      # after first deploy in case Render assigned a different hostname.
      - key: VITE_API_URL
        value: https://expense-tracker-api-chaitanya1301.onrender.com
    routes:
      # React Router client-side routes (e.g. /login) must fall back to
      # index.html rather than 404 on a direct load or refresh.
      - type: rewrite
        source: /*
        destination: /index.html
