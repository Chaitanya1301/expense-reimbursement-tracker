services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_app
      POSTGRES_PASSWORD: expense_app_dev_password
      POSTGRES_DB: expense_tracker
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_app -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  expensetrackerbackend:
    image: expensetrackerbackend
    build:
      context: src/backend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://expense_app:expense_app_dev_password@db:5432/expense_tracker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3000:3000

volumes:
  db_data:
